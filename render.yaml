# Version de test uniquement : la branche main reste inchangee.
services:
  - type: web
    name: lsn-livraison-test
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/aurelienleforestier/lsn-livraison
    branch: serveur-test-v6
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn app:app --app-dir server --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lsn-livraison-test-db
          property: connectionString
      - key: REQUIRE_DATABASE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: LSN_ADMIN_EMAIL
        sync: false
      - key: LSN_ADMIN_PASSWORD
        sync: false
      - key: LSN_ADMIN_NAME
        value: Pharmacien administrateur
      - key: SESSION_HOURS
        value: "12"
