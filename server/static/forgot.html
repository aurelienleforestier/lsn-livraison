<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe oublié — LSN PHARMA</title><style>body{margin:0;background:#f5f7f8;font-family:Inter,system-ui,Arial;color:#111827}.box{max-width:420px;margin:8vh auto;background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e7eb}.input,.btn{width:100%;box-sizing:border-box;border-radius:12px;padding:13px;font-size:16px;margin-top:8px}.input{border:1px solid #d1d5db}.btn{border:0;background:#111827;color:#fff;font-weight:800}.msg{background:#dbeafe;color:#1e40af;padding:10px;border-radius:10px;margin-top:10px}.muted{color:#667085;font-size:13px}a{color:#2563eb;text-decoration:none}</style></head><body><div class="box"><h1>Mot de passe oublié</h1><p class="muted">Saisis l'adresse associée à ton compte LSN PHARMA.</p><input id="email" class="input" type="email" autocomplete="username" placeholder="E-mail"><button class="btn" onclick="send()">DEMANDER LA RÉINITIALISATION</button><div id="msg" role="status"></div><p class="muted"><a href="/login">← Retour à la connexion</a></p></div><script>async function send(){const msg=document.getElementById('msg');msg.className='msg';try{const r=await fetch('/api/auth/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Demande impossible.');msg.textContent=d.message||'Demande enregistrée.'}catch(e){msg.textContent=e.message}}</script></body></html>
