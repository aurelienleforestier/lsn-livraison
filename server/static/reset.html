<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réinitialisation — LSN PHARMA</title><style>body{margin:0;background:#f5f7f8;font-family:Inter,system-ui,Arial;color:#111827}.box{max-width:420px;margin:8vh auto;background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e7eb}.input,.btn{width:100%;box-sizing:border-box;border-radius:12px;padding:13px;font-size:16px;margin-top:8px}.input{border:1px solid #d1d5db}.btn{border:0;background:#111827;color:#fff;font-weight:800}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}</style></head><body><div class="box"><h1>Nouveau mot de passe</h1><input id="password" class="input" type="password" autocomplete="new-password" placeholder="10 caractères minimum"><button class="btn" onclick="resetPw()">ENREGISTRER</button><div id="msg" role="status"></div><p><a href="/login">Retour à la connexion</a></p></div><script>async function resetPw(){const msg=document.getElementById('msg');try{const token=new URLSearchParams(location.search).get('token')||'';const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Réinitialisation impossible.');msg.className='msg ok';msg.textContent='Mot de passe modifié. Tu peux te connecter.'}catch(e){msg.className='msg err';msg.textContent=e.message}}</script></body></html>
