<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2d357f"><title>Réinitialisation — LSN PHARMA</title><style>:root{--blue:#2d357f;--ink:#202750;--green:#008875;--line:#dfe2e9;--ivory:#f7f8f4}*{box-sizing:border-box}body{margin:0;background:var(--ivory);font-family:Inter,system-ui,Arial;color:var(--ink)}.box{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border-radius:22px;border:1px solid var(--line)}.logo{display:flex;justify-content:center;margin-bottom:18px}.logo img{width:170px;max-width:70%;height:auto}.input,.btn{width:100%;border-radius:13px;padding:14px;font-size:16px;margin-top:10px}.input{border:1px solid #cfd3df}.btn{border:0;background:var(--blue);color:#fff;font-weight:900}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#e2f4ef;color:#006b5d}.err{background:#fee2e2;color:#991b1b}a{color:var(--green);text-decoration:none;font-weight:700}h1{text-align:center;color:var(--blue)}</style></head><body><div class="box"><div class="logo"><img src="/lsn-logo.svg" alt="LSN PHARMA"></div><h1>Nouveau mot de passe</h1><input id="password" class="input" type="password" autocomplete="new-password" placeholder="10 caractères minimum"><button class="btn" onclick="resetPw()">ENREGISTRER</button><div id="msg" role="status"></div><p><a href="/login">Retour à la connexion</a></p></div><script>async function resetPw(){const msg=document.getElementById('msg');try{const token=new URLSearchParams(location.search).get('token')||'';const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Réinitialisation impossible.');msg.className='msg ok';msg.textContent='Mot de passe modifié. Tu peux te connecter.'}catch(e){msg.className='msg err';msg.textContent=e.message}}</script></body></html>
