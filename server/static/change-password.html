<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2d357f"><title>Changer le mot de passe — LSN PHARMA</title><style>:root{--blue:#2d357f;--ink:#202750;--green:#008875;--line:#dfe2e9;--ivory:#f7f8f4}*{box-sizing:border-box}body{margin:0;background:var(--ivory);font-family:Inter,system-ui,Arial;color:var(--ink)}.box{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border-radius:22px;border:1px solid var(--line)}.logo{display:flex;justify-content:center;margin-bottom:18px}.logo img{width:170px;max-width:70%;height:auto}.input,.btn{width:100%;border-radius:13px;padding:14px;font-size:16px;margin-top:10px}.input{border:1px solid #cfd3df}.btn{border:0;background:var(--blue);color:#fff;font-weight:900}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:10px}.muted{color:#667085;font-size:13px;line-height:1.5}h1{text-align:center;color:var(--blue)}</style></head><body><div class="box"><div class="logo"><img src="/lsn-logo.svg" alt="LSN PHARMA"></div><h1>Choisir ton mot de passe</h1><p class="muted">Le mot de passe temporaire doit être remplacé avant d'utiliser l'application.</p><input id="password" class="input" type="password" autocomplete="new-password" placeholder="10 caractères minimum"><input id="confirm" class="input" type="password" autocomplete="new-password" placeholder="Confirmer"><button class="btn" onclick="change()">ENREGISTRER</button><div id="msg" role="alert"></div></div><script>let csrf='';async function init(){try{const r=await fetch('/api/me');if(!r.ok){location.href='/login';return}const d=await r.json();csrf=d.csrf}catch(e){document.getElementById('msg').textContent='Connexion indisponible. Recharge la page.'}}async function change(){try{if(document.getElementById('password').value!==document.getElementById('confirm').value)throw new Error('Les deux mots de passe sont différents.');const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Mot de passe invalide : 10 caractères minimum.');localStorage.setItem('lsn-last-activity',String(Date.now()));location.href='/'}catch(e){const msg=document.getElementById('msg');msg.className='err';msg.textContent=e.message}}init();</script></body></html>
