<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changer le mot de passe — LSN PHARMA</title><style>body{margin:0;background:#f5f7f8;font-family:Inter,system-ui,Arial;color:#111827}.box{max-width:420px;margin:8vh auto;background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e7eb}.input,.btn{width:100%;box-sizing:border-box;border-radius:12px;padding:13px;font-size:16px;margin-top:8px}.input{border:1px solid #d1d5db}.btn{border:0;background:#111827;color:#fff;font-weight:800}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:10px}.muted{color:#667085;font-size:13px}</style></head><body><div class="box"><h1>Choisir ton mot de passe</h1><p class="muted">Le mot de passe temporaire doit être remplacé avant d'utiliser l'application.</p><input id="password" class="input" type="password" autocomplete="new-password" placeholder="10 caractères minimum"><input id="confirm" class="input" type="password" autocomplete="new-password" placeholder="Confirmer"><button class="btn" onclick="change()">ENREGISTRER</button><div id="msg" role="alert"></div></div><script>let csrf='';async function init(){try{const r=await fetch('/api/me');if(!r.ok){location.href='/login';return}const d=await r.json();csrf=d.csrf}catch(e){document.getElementById('msg').textContent='Connexion indisponible. Recharge la page.'}}async function change(){try{if(document.getElementById('password').value!==document.getElementById('confirm').value)throw new Error('Les deux mots de passe sont différents.');const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Mot de passe invalide : 10 caractères minimum.');location.href='/'}catch(e){const msg=document.getElementById('msg');msg.className='err';msg.textContent=e.message}}init();</script></body></html>
