<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>Connexion — LSN PHARMA</title><style>body{margin:0;background:#f5f7f8;font-family:Inter,system-ui,Arial;color:#111827}.box{max-width:420px;margin:8vh auto;background:white;padding:24px;border-radius:20px;border:1px solid #e5e7eb}.logo{font-size:24px;font-weight:900;margin-bottom:24px}.logo span{font-weight:600}.input,.btn{width:100%;box-sizing:border-box;border-radius:12px;padding:13px;font-size:16px;margin-top:8px}.input{border:1px solid #d1d5db}.btn{border:0;background:#111827;color:white;font-weight:800}.muted{color:#667085;font-size:13px}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:10px}a{color:#2563eb;text-decoration:none}</style></head><body><div class="box"><div class="logo">LSN <span>PHARMA</span></div><h1>Connexion</h1><p class="muted">Version de test interne — données fictives uniquement</p><input id="email" class="input" type="email" autocomplete="username" placeholder="E-mail / identifiant"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Mot de passe"><button class="btn" onclick="login()">SE CONNECTER</button><div id="msg" role="alert"></div><p class="muted"><a href="/forgot">Mot de passe oublié ?</a></p></div><script>async function login(){const msg=document.getElementById('msg');msg.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Connexion impossible');location.href=d.mustChangePassword?'/change-password':'/'}catch(e){msg.className='err';msg.textContent=e.message}}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
