<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2d357f">
<link rel="manifest" href="/manifest.webmanifest">
<title>Connexion — LSN PHARMA</title>
<style>
:root{--blue:#2d357f;--ink:#202750;--green:#008875;--line:#dfe2e9;--ivory:#f7f8f4;--pink:#df0084}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
.test{padding:8px 14px;text-align:center;background:#fff7ed;color:#7c2d12;font-size:12px}
.box{max-width:430px;margin:6vh auto;background:#fff;padding:28px;border-radius:22px;border:1px solid var(--line);box-shadow:0 16px 40px rgba(32,39,80,.08)}
.logo{display:flex;justify-content:center;margin:0 auto 18px}
.logo img{width:190px;max-width:72%;height:auto;display:block}
h1{margin:0 0 6px;text-align:center;font-size:28px;color:var(--blue)}
.input,.btn{width:100%;border-radius:13px;padding:14px;font-size:16px;margin-top:10px}
.input{border:1px solid #cfd3df;color:var(--ink);background:#fff}
.input:focus{outline:3px solid rgba(0,136,117,.16);border-color:var(--green)}
.btn{border:0;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}
.btn:hover{filter:brightness(.96)}
.muted{color:#667085;font-size:13px;line-height:1.45}
.center{text-align:center}
.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:10px}
a{color:var(--green);text-decoration:none;font-weight:700}
.password-wrap{position:relative}
.password-wrap .input{padding-right:95px}
.toggle{position:absolute;right:9px;top:19px;border:0;background:#eef2ff;color:var(--blue);padding:7px 9px;border-radius:9px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="test">VERSION DE TEST — Données fictives uniquement</div>
<div class="box">
  <div class="logo"><img src="/lsn-logo.svg" alt="LSN PHARMA"></div>
  <h1>Connexion</h1>
  <p class="muted center">Application interne LSN PHARMA</p>
  <input id="identifier" class="input" type="text" autocomplete="username" placeholder="Nom utilisateur ou e-mail">
  <div class="password-wrap">
    <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Mot de passe">
    <button id="togglePassword" class="toggle" type="button" onclick="togglePassword()">Afficher</button>
  </div>
  <button class="btn" onclick="login()">SE CONNECTER</button>
  <div id="msg" role="alert"></div>
  <p class="muted center"><a href="/forgot">Mot de passe oublié ?</a></p>
</div>
<script>
function togglePassword(){
 const p=document.getElementById('password'),b=document.getElementById('togglePassword');
 const show=p.type==='password';p.type=show?'text':'password';b.textContent=show?'Masquer':'Afficher';
}
async function login(){
 const msg=document.getElementById('msg');msg.textContent='';msg.className='';
 try{
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('identifier').value.trim(),password:document.getElementById('password').value})});
  const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Connexion impossible');
  localStorage.setItem('lsn-last-activity',String(Date.now()));
  location.href=d.mustChangePassword?'/change-password':'/';
 }catch(e){msg.className='err';msg.textContent=e.message}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body></html>
